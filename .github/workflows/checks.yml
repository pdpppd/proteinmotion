name: Package checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,md]'
      - run: ruff check src tests examples scripts skills
      - run: ruff format --check src tests examples scripts skills
      - run: pytest -m "not gpu" -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check the built wheel outside the checkout
        if: runner.os != 'Windows'
        run: |
          python -m venv "$RUNNER_TEMP/proteinmotion-wheel"
          "$RUNNER_TEMP/proteinmotion-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/proteinmotion-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_package.py"
      - name: Check the built wheel on Windows outside the checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheelPython = Join-Path $env:RUNNER_TEMP 'proteinmotion-wheel/Scripts/python.exe'
          python -m venv (Join-Path $env:RUNNER_TEMP 'proteinmotion-wheel')
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & $wheelPython -m pip install $wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-Location $env:RUNNER_TEMP
          & $wheelPython -I (Join-Path $env:GITHUB_WORKSPACE 'scripts/check_installed_package.py')
