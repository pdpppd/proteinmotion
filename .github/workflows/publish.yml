name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to PyPI (select a version tag; false only builds and checks)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify release version
        env:
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          tree = ast.parse(pathlib.Path('src/proteinmotion/__init__.py').read_text())
          version = next(ast.literal_eval(n.value) for n in tree.body
                         if isinstance(n, ast.Assign)
                         and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert project['name'] == 'proteinmotion'
          assert version == project['version'], 'Package and metadata versions differ'
          if os.environ['PUBLISH'] == 'true':
              assert os.environ['GITHUB_REF_TYPE'] == 'tag', 'Publish from a version tag'
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and package versions differ'
          print(f'Preparing proteinmotion {version}')
          PY
      - run: python -m pip install -e '.[dev,md]'
      - run: ruff check src tests examples scripts skills
      - run: ruff format --check src tests examples scripts skills
      - run: pytest -m "not gpu" -q
      - name: Build wheel from the source distribution
        run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Install the wheel and verify outside the checkout
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          proteinmotion --version
          python -I "$GITHUB_WORKSPACE/scripts/check_installed_package.py"

  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: [build, install]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proteinmotion/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish the verified distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
