[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proteinmotion"
version = "0.11.0"
description = "Animate proteins, DNA, and RNA with a Manim-inspired Python API and native GPU or Blender EEVEE rendering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "src/proteinmotion/fonts/OFL.txt", "src/proteinmotion/licenses/Manim-LICENSE.txt"]
authors = [{ name = "Pranav Punuru" }]
keywords = ["protein", "molecular-visualization", "animation", "dna", "rna", "gpu", "manim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.26", "scipy>=1.12", "gemmi>=0.7,<0.8", "wgpu>=0.31,<0.33", "pillow>=10", "av>=18,<19", "fonttools>=4.55,<5", "uharfbuzz>=0.45,<1", "mapbox-earcut>=1.0,<3", "scikit-image>=0.24,<0.27"]

[project.urls]
Homepage = "https://pdpppd.github.io/proteinmotion/"
Documentation = "https://pdpppd.github.io/proteinmotion/docs/getting-started/"
Repository = "https://github.com/pdpppd/proteinmotion"
Issues = "https://github.com/pdpppd/proteinmotion/issues"
Changelog = "https://github.com/pdpppd/proteinmotion/releases"

[project.optional-dependencies]
preview = ["rendercanvas>=2.4,<3", "glfw>=2.7"]
md = ["MDAnalysis>=2.9,<3"]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2", "twine>=6.1"]
plots = ["matplotlib>=3.8"]

[project.scripts]
proteinmotion = "proteinmotion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a working native GPU adapter"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/proteinmotion"]

[tool.hatch.build.targets.wheel.force-include]
"skills/proteinmotion-movies/SKILL.md" = "proteinmotion/_skill/SKILL.md"
"skills/proteinmotion-movies/agents/openai.yaml" = "proteinmotion/_skill/agents/openai.yaml"
"skills/proteinmotion-movies/references/data-visualization.md" = "proteinmotion/_skill/references/data-visualization.md"
"skills/proteinmotion-movies/references/nucleic-acids.md" = "proteinmotion/_skill/references/nucleic-acids.md"
"skills/proteinmotion-movies/references/animation.md" = "proteinmotion/_skill/references/animation.md"
"skills/proteinmotion-movies/references/annotations-and-interactions.md" = "proteinmotion/_skill/references/annotations-and-interactions.md"
"skills/proteinmotion-movies/assets/film.py" = "proteinmotion/_skill/assets/film.py"
"skills/proteinmotion-movies/assets/1ubq.cif" = "proteinmotion/_skill/assets/1ubq.cif"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/skills", "/scripts", "/docs", "/README.md", "/CONTRIBUTING.md", "/THIRD_PARTY.md", "/LICENSE", "/pyproject.toml"]
exclude = ["**/.*_offsets.npz", "**/.*_offsets.lock"]
