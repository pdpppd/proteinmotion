[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proteinmotion"
version = "0.4.0"
description = "Programmatic protein animation with a Manim-inspired API and native Metal rendering"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.12", "gemmi>=0.7,<0.8", "wgpu>=0.31,<0.33", "pillow>=10", "av>=18,<19"]

[project.urls]
Homepage = "https://pdpppd.github.io/proteinmotion/"
Documentation = "https://pdpppd.github.io/proteinmotion/docs/getting-started/"
Repository = "https://github.com/pdpppd/proteinmotion"
Issues = "https://github.com/pdpppd/proteinmotion/issues"

[project.optional-dependencies]
preview = ["rendercanvas>=2.4,<3", "glfw>=2.7"]
md = ["MDAnalysis>=2.9,<3"]
dev = ["pytest>=8", "ruff>=0.9", "build"]
plots = ["matplotlib>=3.8"]

[project.scripts]
proteinmotion = "proteinmotion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a working native GPU adapter"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/proteinmotion"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml"]
